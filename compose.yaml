services:
  serverwatch:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SW_DASHBOARD_HOST: 0.0.0.0
      SW_DASHBOARD_PORT: 8787
      SW_DATABASE: /data/serverwatch.sqlite3
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - serverwatch-data:/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
volumes:
  serverwatch-data:
